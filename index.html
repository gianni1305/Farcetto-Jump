// Original upbeat arcade groove: 124 BPM, warm bass, soft lead and percussion.
// All audio is synthesized locally. Playback starts only after a user tap.
const musicBtn=document.getElementById('musicBtn');
let musicOn=false,audioCtx=null,musicMaster=null,noiseBuffer=null,nextNote=0,noteIndex=0;
const bpm=124,stepLength=60/bpm/4;
const roots=[0,5,8,7,0,5,10,7];
const bassPattern=[0,null,0,7,null,0,3,null,0,null,7,5,null,3,7,null];
const leadPattern=[12,null,15,null,19,null,15,12,null,17,null,15,12,null,10,null,
  12,null,17,19,null,17,15,null,12,15,null,10,12,null,7,null,
  15,null,19,null,22,null,19,17,null,15,null,12,15,null,12,null,
  19,null,17,15,null,12,10,null,12,null,15,17,null,12,7,null];
function makeMusicAudio(){
 const AudioCtor=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtor)return false;
 if(!audioCtx){
  audioCtx=new AudioCtor();musicMaster=audioCtx.createGain();
  musicMaster.gain.value=.56;musicMaster.connect(audioCtx.destination);
  noiseBuffer=audioCtx.createBuffer(1,Math.ceil(audioCtx.sampleRate*.24),audioCtx.sampleRate);
  const ch=noiseBuffer.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1);
 }
 return true;
}
function noteHz(midi){return 440*Math.pow(2,(midi-69)/12)}
function synth(midi,at,dur,vol,type='triangle'){
 const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
 osc.type=type;osc.frequency.setValueAtTime(noteHz(midi),at);
 filter.type='lowpass';filter.frequency.value=type==='sawtooth'?1450:2400;
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.012);
 g.gain.exponentialRampToValueAtTime(.0001,at+dur);
 osc.connect(filter);filter.connect(g);g.connect(musicMaster);
 osc.start(at);osc.stop(at+dur+.02);
}
function drum(at,kind){
 const g=audioCtx.createGain(),osc=audioCtx.createOscillator();
 osc.type='sine';osc.connect(g);g.connect(musicMaster);
 if(kind==='kick'){
  osc.frequency.setValueAtTime(130,at);osc.frequency.exponentialRampToValueAtTime(46,at+.11);
  g.gain.setValueAtTime(.23,at);g.gain.exponentialRampToValueAtTime(.0001,at+.16);
  osc.start(at);osc.stop(at+.17);
 }else{
  osc.frequency.value=165;
  g.gain.setValueAtTime(.035,at);g.gain.exponentialRampToValueAtTime(.0001,at+.075);
  osc.start(at);osc.stop(at+.08);
  const n=audioCtx.createBufferSource(),ng=audioCtx.createGain(),hp=audioCtx.createBiquadFilter();
  n.buffer=noiseBuffer;hp.type='highpass';hp.frequency.value=kind==='snare'?1550:6500;
  ng.gain.setValueAtTime(kind==='snare'?.07:.022,at);
  ng.gain.exponentialRampToValueAtTime(.0001,at+(kind==='snare'?.13:.045));
  n.connect(hp);hp.connect(ng);ng.connect(musicMaster);
  n.start(at);n.stop(at+(kind==='snare'?.14:.05));
 }
}
function tickMusic(){
 if(!musicOn||!audioCtx||audioCtx.state!=='running'||state!=='play')return;
 if(nextNote<audioCtx.currentTime)nextNote=audioCtx.currentTime+.035;
 let count=0;
 while(nextNote<audioCtx.currentTime+.17&&count++<8){
  const i=noteIndex++,beat=i%16,root=roots[Math.floor(i/16)%roots.length];
  if(beat%4===0)drum(nextNote,'kick');
  if(beat===4||beat===12)drum(nextNote,'snare');
  if(i%2===0)drum(nextNote,'hat');
  if(bassPattern[beat]!==null)synth(36+root+bassPattern[beat],nextNote,.16,.065,'triangle');
  const m=leadPattern[i%leadPattern.length];
  if(m!==null)synth(60+root+m-12,nextNote,.10,.026,'sine');
  if(beat===0)synth(48+root,nextNote,.34,.012,'sine');
  nextNote+=stepLength;
 }
}
musicBtn.onclick=async()=>{
 try{
  if(!musicOn){
   if(!makeMusicAudio()){musicBtn.title='Audio non pris en charge';return}
   await audioCtx.resume();musicOn=true;noteIndex=0;nextNote=audioCtx.currentTime+.045;
   musicBtn.textContent='♫';musicBtn.title='Couper la musique';musicBtn.setAttribute('aria-label','Couper la musique');
  }else{
   musicOn=false;musicBtn.textContent='♫̸';musicBtn.title='Activer la musique';musicBtn.setAttribute('aria-label','Activer la musique');
   if(audioCtx)await audioCtx.suspend();
  }
 }catch(e){musicOn=false;musicBtn.title='Audio indisponible'}
};
