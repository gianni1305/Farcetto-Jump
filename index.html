function reset(){score=0;topY=0;time=0;difficulty=0;enemies=[];helicopters=[];bonus=[];effects={jet:0,shield:0};player={x:W/2-25,y:H-185,w:50,h:53,vy:-13.6};platforms=[{x:W/2-48,y:H-115,w:96,h:14,t:0,speed:0,broken:false,spring:false}];let y=H-115,px=W/2-45;while(y>-H){y-=gap();let p=makePlatform(y,px);platforms.push(p);px=p.x}state='play';scoreEl.textContent=0;menu.style.display='none';prev=performance.now()}
function gap(){return 65+Math.random()*21+Math.min(14,difficulty*2)}
function makePlatform(y,near){
 const w=Math.max(53,78-Math.min(24,difficulty*2))+Math.random()*7;
 const x=Math.max(3,Math.min(W-w-3,near+(Math.random()-.5)*Math.min(W*.58,100+Math.min(18,difficulty)*6)));
 const roll=Math.random(),moveChance=Math.min(.3,.08+difficulty*.014),breakChance=Math.min(.19,.035+difficulty*.012),vanishChance=Math.min(.14,Math.max(0,difficulty-2)*.009);
 let t=0;if(roll<moveChance)t=1;else if(roll<moveChance+breakChance)t=2;else if(roll<moveChance+breakChance+vanishChance)t=3;
 const p={x,y,w,h:13,t,speed:t===1?(Math.random()<.5?-1:1)*(0.6+Math.min(16,difficulty)*.13):0,broken:false,spring:t===0&&Math.random()<.055,fade:0};
 if(t===0&&Math.random()<.035){bonus.push({x:p.x+p.w/2,y:p.y-23,type:Math.random()<.35?'shield':'jet',used:false})}
 if(topY>600&&Math.random()<Math.min(.045,difficulty*.006)&&enemies.every(e=>Math.abs(e.y-y)>250))enemies.push({x:Math.random()*Math.max(1,W-45),y:y-48,vx:(Math.random()<.5?-1:1)*(.6+Math.min(18,difficulty)*.12),r:22});
 if(topY>1100&&Math.random()<Math.min(.06,.012+difficulty*.002)&&helicopters.every(h=>Math.abs(h.y-y)>350))helicopters.push({x:Math.random()<.5?-65:W+65,y:y-72,vx:(Math.random()<.5?-1:1)*(1.15+Math.min(15,difficulty)*.08),w:75,h:29,phase:Math.random()*6.28});
 return p;
}
function end(){if(score>0){ranking.push({score,date:new Date().toLocaleDateString('fr-FR')});ranking.sort((a,b)=>b.score-a.score);ranking=ranking.slice(0,5);try{localStorage.setItem('farcettoTop5',JSON.stringify(ranking))}catch(e){}board()}back.style.display='block';state='dead';if(score>best){best=score;bestEl.textContent='★ '+best;try{localStorage.setItem('farcettoBest',best)}catch(e){}}msg.innerHTML='Partie terminée !<br>Score : '+score+'<br>Record : '+best;btn.textContent='REJOUER';menu.style.display='flex'}
const SHARE_URL='https://gianni1305.github.io/Farcetto-Jump/';
const shareFeedback=document.getElementById('shareFeedback');
function shareText(){
 const current=state==='dead'?score:Math.max(score,0);
 const record=Math.max(best,...ranking.map(x=>x.score),0);
 return '🎮 Farcetto Jump !\n🏆 Mon score : '+current+' points\n⭐ Mon record : '+record+' points\nTu peux me battre ? 😏\n'+SHARE_URL;
}
function showShareFeedback(t){shareFeedback.textContent=t;}
document.getElementById('shareBtn').onclick=async()=>{

};

function update(dt){

 player.y+=player.vy*dt;
 for(const p of platforms){
  if(p.t===1){p.x+=p.speed*dt;if(p.x<2){p.x=2;p.speed=Math.abs(p.speed)}if(p.x+p.w>W-2){p.x=W-2-p.w;p.speed=-Math.abs(p.speed)}}
  if(p.fade>0){p.fade-=dt;if(p.fade<=0)p.broken=true}
  if(p.broken)continue;
  if(effects.jet<=0&&player.vy>0&&oldBottom<=p.y+9&&player.y+player.h>=p.y&&player.x+player.w-8>p.x&&player.x+8<p.x+p.w){
   if(p.t===2){p.broken=true;continue}
   player.y=p.y-player.h;player.vy=p.spring?-20:-13.6;
   if(p.t===3)p.fade=17;
   break;
  }
 }
 for(const b of bonus){if(b.used)continue; if(Math.abs(player.x+25-b.x)<34&&Math.abs(player.y+26-b.y)<36){b.used=true;if(b.type==='jet'){effects.jet=65;player.vy=-10.5}else effects.shield=480}}
 for(const e of enemies){
  e.x+=e.vx*dt;if(e.x<e.r){e.x=e.r;e.vx=Math.abs(e.vx)}if(e.x>W-e.r){e.x=W-e.r;e.vx=-Math.abs(e.vx)}
  if(Math.abs(player.x+25-e.x)<33&&Math.abs(player.y+26-e.y)<37){
   if(effects.shield>0){e.dead=true;effects.shield=0;player.vy=-15}else{end();return}
  }
 }
 for(const h of helicopters){
  h.x+=h.vx*dt;
  if(h.x<-h.w){h.x=-h.w;h.vx=Math.abs(h.vx)}
  if(h.x>W+h.w){h.x=W+h.w;h.vx=-Math.abs(h.vx)}
  if(player.x+player.w-6>h.x-28&&player.x+6<h.x+28&&player.y+player.h-7>h.y-17&&player.y+7<h.y+17){
   if(effects.shield>0){h.dead=true;effects.shield=0;player.vy=-15}else{end();return}
  }
 }
 effects.shield=Math.max(0,effects.shield-dt);
 if(player.y<H*.42&&player.vy<0){
  const rise=H*.42-player.y;player.y+=rise;
  for(const p of platforms)p.y+=rise;
  for(const b of bonus)b.y+=rise;
  for(const e of enemies)e.y+=rise;
  for(const h of helicopters)h.y+=rise;
  topY+=rise;score=Math.max(score,Math.floor(topY/10));scoreEl.textContent=score;
 }
 platforms=platforms.filter(p=>p.y<H+40&&!p.broken);
 bonus=bonus.filter(b=>!b.used&&b.y<H+50);
 enemies=enemies.filter(e=>!e.dead&&e.y<H+60);
 helicopters=helicopters.filter(h=>!h.dead&&h.y<H+75);
 let anchor=platforms.length?platforms.reduce((a,b)=>a.y<b.y?a:b):{x:Math.max(3,Math.min(W-78,player.x)),y:H*.42-50};
 let highest=anchor.y;
 while(highest>-140){
  highest-=gap();const fresh=makePlatform(highest,anchor.x);
  platforms.push(fresh);anchor=fresh;
 }
 if(player.y>H+60)end();
}

function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){
 const gradient=ctx.createLinearGradient(0,0,0,H);
 if(difficulty>=8){const cycle=Math.floor(difficulty/8)%3;const hues=[310,255,185];const h=hues[cycle];gradient.addColorStop(0,'hsl('+h+' 45% 13%)');gradient.addColorStop(1,'hsl('+h+' 42% 27%)')}
 else if(difficulty>=4){gradient.addColorStop(0,'#132848');gradient.addColorStop(1,'#2a4560')}
 else{gradient.addColorStop(0,'#0a1931');gradient.addColorStop(1,'#163756')}
 ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffff15';
 for(let x=20;x<W;x+=36)for(let y=20;y<H;y+=36){ctx.beginPath();ctx.arc(x,(y+(topY*.12)%36)%H,1.5,0,Math.PI*2);ctx.fill()}
 if(!player)return;
 for(const p of platforms){
  if(p.broken)continue;
  const colors=['#b4f76f','#65d8ff','#faab70','#d9a4ff'];
  ctx.globalAlpha=p.fade>0?Math.max(.12,p.fade/17):1;
  ctx.fillStyle=colors[p.t];round(p.x,p.y,p.w,p.h,6);ctx.fill();
  ctx.fillStyle='#ffffff78';round(p.x+5,p.y+3,p.w-10,3,2);ctx.fill();
  if(p.t===1){ctx.fillStyle='#164f79';ctx.font='bold 10px system-ui';ctx.fillText('↔',p.x+p.w/2-5,p.y+11)}
  if(p.t===2){ctx.strokeStyle='#78472f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w*.36,p.y+1);ctx.lineTo(p.x+p.w*.5,p.y+10);ctx.lineTo(p.x+p.w*.67,p.y+4);ctx.stroke()}
  if(p.t===3){ctx.fillStyle='#59396c';ctx.fillRect(p.x+10,p.y+6,p.w-20,2)}
  if(p.spring){ctx.fillStyle='#e9f8ff';ctx.fillRect(p.x+p.w/2-11,p.y-9,22,5);ctx.strokeStyle='#f9dc4b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+p.w/2-7,p.y-3);ctx.lineTo(p.x+p.w/2+6,p.y-8);ctx.lineTo(p.x+p.w/2-6,p.y-12);ctx.stroke()}
  ctx.globalAlpha=1;
 }
 for(const b of bonus){
  ctx.save();ctx.translate(b.x,b.y+Math.sin(time*.08)*3);ctx.shadowBlur=12;ctx.shadowColor=b.type==='jet'?'#ffca4c':'#5fe7ff';
  ctx.fillStyle=b.type==='jet'?'#ffca4c':'#6eeaff';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.font='19px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.type==='jet'?'🚀':'🛡️',0,0);ctx.restore()
 }

 for(const e of enemies){
  ctx.save();ctx.translate(e.x,e.y+Math.sin(time*.05)*4);
  ctx.fillStyle='#e94250';ctx.beginPath();ctx.arc(0,0,e.r+2,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(0,0,e.r-2,0,Math.PI*2);ctx.clip();
  if(enemyFace.complete&&enemyFace.naturalWidth)ctx.drawImage(enemyFace,-e.r,-e.r,e.r*2,e.r*2);
  else {ctx.fillStyle='#b4745f';ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2)}
  ctx.restore();ctx.restore()
 }
 for(const h of helicopters){
  ctx.save();ctx.translate(h.x,h.y+Math.sin(time*.065+h.phase)*4);
  ctx.strokeStyle='#a6e7f2';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-34,-6);ctx.lineTo(-61,-18);ctx.lineTo(-61,0);ctx.stroke();
  ctx.fillStyle='#4bb7b9';ctx.beginPath();ctx.ellipse(0,0,29,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#102d55';ctx.beginPath();ctx.ellipse(12,-3,10,8,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#dcecf5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,15);ctx.lineTo(-18,21);ctx.lineTo(18,21);ctx.lineTo(14,15);ctx.stroke();
  ctx.strokeStyle='#c7edf7';ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,-21);ctx.stroke();
  const rot=time*.7+h.phase;
  ctx.strokeStyle='#e5f7ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(Math.sin(rot)*35,-22);ctx.lineTo(-Math.sin(rot)*35,-22);ctx.stroke();
  ctx.restore()
 }
 ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=9;ctx.shadowOffsetY=4;ctx.shadowBlur=0;
 ctx.save();
 if(face.complete&&face.naturalWidth)ctx.drawImage(face,player.x-10,player.y-15,player.w+20,player.h+28);
 else{ctx.fillStyle='#bf915e';ctx.fillRect(player.x,player.y,player.w,player.h)}
 ctx.restore();ctx.restore();
 if(effects.shield>0){ctx.strokeStyle='#6eeaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x+25,player.y+26,38,0,Math.PI*2);ctx.stroke()}
 if(effects.jet>0){ctx.fillStyle='#ffcc43';ctx.beginPath();ctx.moveTo(player.x+12,player.y+53);ctx.lineTo(player.x+25,player.y+82+Math.random()*12);ctx.lineTo(player.x+38,player.y+53);ctx.fill()}
 ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillStyle='#ffffffc9';
 ctx.fillText('NIVEAU '+(difficulty+1),W/2,Math.max(72,(parseInt(getComputedStyle(document.documentElement).fontSize)||16)*4));
}
function frame(t){const dt=Math.min((t-prev)/16.666||1,2);prev=t;update(dt);draw();requestAnimationFrame(frame)}reset();home();requestAnimationFrame(frame);
</script></body></html>
