 const roll=Math.random(),moveChance=Math.min(.3,.08+difficulty*.014),breakChance=Math.min(.19,.035+difficulty*.012),vanishChance=Math.min(.14,Math.max(0,difficulty-2)*.009);

 const p={x,y,w,h:13,t,speed:t===1?(Math.random()<.5?-1:1)*(0.6+Math.min(16,difficulty)*.13):0,broken:false,spring:t===0&&Math.random()<.055,fade:0};
 if(t===0&&Math.random()<.035){bonus.push({x:p.x+p.w/2,y:p.y-23,type:Math.random()<.35?'shield':'jet',used:false})}
 if(topY>350&&Math.random()<Math.min(.045,.012+difficulty*.006)&&enemies.every(e=>Math.abs(e.y-y)>250))enemies.push({x:Math.random()*Math.max(1,W-45),y:y-48,vx:(Math.random()<.5?-1:1)*(.6+Math.min(18,difficulty)*.12),r:22});
 if(topY>600&&Math.random()<Math.min(.075,.016+difficulty*.003)&&helicopters.every(h=>Math.abs(h.y-y)>290))helicopters.push({x:Math.random()<.5?-95:W+95,y:y-72,vx:(Math.random()<.5?-1:1)*(1.15+Math.min(15,difficulty)*.08),w:112,h:43,phase:Math.random()*6.28});
 return p;
}
function end(){if(score>0){ranking.push({score,date:new Date().toLocaleDateString('fr-FR')});ranking.sort((a,b)=>b.score-a.score);ranking=ranking.slice(0,5);try{localStorage.setItem('farcettoTop5',JSON.stringify(ranking))}catch(e){}board()}back.style.display='block';state='dead';if(score>best){best=score;bestEl.textContent='★ '+best;try{localStorage.setItem('farcettoBest',best)}catch(e){}}msg.innerHTML='Partie terminée !<br>Score : '+score+'<br>Record : '+best;btn.textContent='REJOUER';menu.style.display='flex'}
const SHARE_URL='https://gianni1305.github.io/Farcetto-Jump/';
const shareFeedback=document.getElementById('shareFeedback');
function shareText(){
 const current=state==='dead'?score:Math.max(score,0);
 const record=Math.max(best,...ranking.map(x=>x.score),0);
 return '🎮 Farcetto Jump !\n🏆 Mon score : '+current+' points\n⭐ Mon record : '+record+' points\nTu peux me battre ? 😏\n'+SHARE_URL;
}
function showShareFeedback(t){shareFeedback.textContent=t;}
document.getElementById('shareBtn').onclick=async()=>{
 const text=shareText();
 if(navigator.share){try{await navigator.share({title:'Farcetto Jump — mon score',text});showShareFeedback('Score prêt à partager !');return}catch(e){if(e.name==='AbortError')return;}}
 try{await navigator.clipboard.writeText(text);showShareFeedback('Score copié ! Colle-le dans WhatsApp ou Messages.')}
 catch(e){showShareFeedback('Utilise le bouton WhatsApp ou Copier.')}
};
document.getElementById('whatsappBtn').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank','noopener,noreferrer')};
document.getElementById('copyBtn').onclick=async()=>{
 try{await navigator.clipboard.writeText(shareText());showShareFeedback('Score et lien copiés !')}
 catch(e){showShareFeedback('Copie impossible dans ce navigateur.')}
};
function home(){state='menu';menu.style.display='flex';msg.innerHTML='Grimpe sans limite de niveau !<br>La difficulté augmente en altitude.<br>🚀 Jetpack · 🛡️ Bouclier · Ressorts<br>Évite les monstres et les hélicoptères !';btn.textContent='JOUER';back.style.display='none';shareFeedback.textContent='';board()}back.onclick=home;document.getElementById('homeBtn').onclick=home;btn.onclick=()=>{if(state==='paused'){state='play';menu.style.display='none';prev=performance.now()}else{reset();back.style.display='none'}};pause.onclick=()=>{if(state==='play'){state='paused';msg.textContent='Partie en pause';btn.textContent='REPRENDRE';back.style.display='block';menu.style.display='flex'}else if(state==='paused'){state='play';menu.style.display='none';prev=performance.now()}};
function press(id,v){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();dir=v;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{if(dir===v)dir=0}))}press('left',-1);press('right',1);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&state==='menu')reset()});addEventListener('keyup',e=>keys[e.key]=false);
function update(dt){
 if(state!=='play')return;
 time+=dt;difficulty=Math.floor(score/115);
 const move=dir||((keys.ArrowLeft||keys.a)?-1:0)||((keys.ArrowRight||keys.d)?1:0);
 player.x+=move*5.4*dt;if(player.x>W)player.x=-player.w;if(player.x+player.w<0)player.x=W;
 const oldBottom=player.y+player.h;
 if(effects.jet>0){effects.jet=Math.max(0,effects.jet-dt);player.vy=-10.5}
 else{player.vy=Math.min(16,player.vy+.38*dt)}
 player.y+=player.vy*dt;
 for(const p of platforms){
  if(p.t===1){p.x+=p.speed*dt;if(p.x<2){p.x=2;p.speed=Math.abs(p.speed)}if(p.x+p.w>W-2){p.x=W-2-p.w;p.speed=-Math.abs(p.speed)}}
  if(p.fade>0){p.fade-=dt;if(p.fade<=0)p.broken=true}
  if(p.broken)continue;
  if(effects.jet<=0&&player.vy>0&&oldBottom<=p.y+9&&player.y+player.h>=p.y&&player.x+player.w-8>p.x&&player.x+8<p.x+p.w){
   if(p.t===2){p.broken=true;continue}
   player.y=p.y-player.h;player.vy=p.spring?-20:-13.6;
   if(p.t===3)p.fade=17;
   break;
  }
 }
 for(const b of bonus){if(b.used)continue; if(Math.abs(player.x+25-b.x)<34&&Math.abs(player.y+26-b.y)<36){b.used=true;if(b.type==='jet'){effects.jet=65;player.vy=-10.5}else effects.shield=480}}
 for(const e of enemies){
  e.x+=e.vx*dt;if(e.x<e.r){e.x=e.r;e.vx=Math.abs(e.vx)}if(e.x>W-e.r){e.x=W-e.r;e.vx=-Math.abs(e.vx)}
  if(Math.abs(player.x+25-e.x)<33&&Math.abs(player.y+26-e.y)<37){
   if(effects.shield>0){e.dead=true;effects.shield=0;player.vy=-15}else{end();return}
  }
 }
 for(const h of helicopters){
  h.x+=h.vx*dt;
  if(h.x<-h.w){h.x=-h.w;h.vx=Math.abs(h.vx)}
  if(h.x>W+h.w){h.x=W+h.w;h.vx=-Math.abs(h.vx)}
  if(player.x+player.w-8>h.x-41&&player.x+8<h.x+47&&player.y+player.h-8>h.y-20&&player.y+8<h.y+20){
   if(effects.shield>0){h.dead=true;effects.shield=0;player.vy=-15}else{end();return}
  }
 }
 effects.shield=Math.max(0,effects.shield-dt);
 if(player.y<H*.42&&player.vy<0){
  const rise=H*.42-player.y;player.y+=rise;
  for(const p of platforms)p.y+=rise;
  for(const b of bonus)b.y+=rise;
  for(const e of enemies)e.y+=rise;
  for(const h of helicopters)h.y+=rise;
  topY+=rise;score=Math.max(score,Math.floor(topY/10));scoreEl.textContent=score;
 }
 platforms=platforms.filter(p=>p.y<H+40&&!p.broken);
 bonus=bonus.filter(b=>!b.used&&b.y<H+50);
 enemies=enemies.filter(e=>!e.dead&&e.y<H+60);
 helicopters=helicopters.filter(h=>!h.dead&&h.y<H+75);
 // Always anchor the next step to a reachable, permanent platform.
 let safePlatforms=platforms.filter(p=>!p.broken&&p.t===0);
 let anchor=safePlatforms.length?safePlatforms.reduce((a,b)=>a.y<b.y?a:b):{x:Math.max(3,Math.min(W-78,player.x)),y:Math.min(player.y-70,H*.42-60)};
 let highest=anchor.y;
 while(highest>-140){
  highest-=gap();const fresh=makePlatform(highest,anchor.x,true);
  platforms.push(fresh);maybeAddBreakable(fresh,highest);anchor=fresh;
 }
 if(player.y>H+60)end();
}

function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function cloud(x,y,size){
 ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.fillStyle='#ffffffcf';
 for(const b of [[-28,5,20],[-7,-5,27],[19,2,23],[36,9,16]]){ctx.beginPath();ctx.arc(b[0],b[1],b[2],0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#76c8fa');sky.addColorStop(.75,'#b2e2fd');sky.addColorStop(1,'#e6f3fb');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(30,128,196,.12)';ctx.lineWidth=1;
 const shift=(topY*.09)%28;
 for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=shift-28;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let i=0;i<6;i++){let x=(i*173+48+Math.sin(i*2.2)*35)%Math.max(W,1);let y=((i*185+100+topY*.17)%(H+150))-55;cloud(x,y,.5+(i%3)*.18)}
 ctx.save();ctx.globalAlpha=.34;ctx.fillStyle='#6995b5';
 ctx.beginPath();ctx.moveTo(0,H+30);for(let x=0;x<=W+20;x+=20){ctx.lineTo(x,H-110+Math.sin(x*.017+topY*.001)*34+Math.sin(x*.035)*14)}ctx.lineTo(W,H);ctx.fill();ctx.restore();
 if(!player)return;
 for(const p of platforms){
  if(p.broken)continue;
  ctx.save();ctx.globalAlpha=p.fade>0?Math.max(.12,p.fade/17):1;
  if(p.t===1)ctx.filter='hue-rotate(145deg) saturate(1.25)';
  if(p.t===3)ctx.filter='hue-rotate(235deg) saturate(.85)';
  const src=[0,150,150,43];
  if(p.t===2&&breakablePerson.complete&&breakablePerson.naturalWidth){
    // Same collision geometry as the original breakable platform.
    ctx.drawImage(breakablePerson,p.x-7,p.y-22,p.w+14,38);
  }else if(!sprite(src[0],src[1],src[2],src[3],p.x-7,p.y-7,p.w+14,29)){
    ctx.fillStyle=p.t===2?'#95715b':p.t===1?'#63c9fc':p.t===3?'#aa84ef':'#93df2c';
    round(p.x,p.y,p.w,p.h,8);ctx.fill();
  }
  ctx.filter='none';
  if(p.spring){
    ctx.fillStyle='#ffe35d';round(p.x+p.w/2-12,p.y-11,24,7,3);ctx.fill();
    ctx.strokeStyle='#3b4553';ctx.lineWidth=2.5;ctx.beginPath();
    ctx.moveTo(p.x+p.w/2-7,p.y-4);ctx.lineTo(p.x+p.w/2+6,p.y-8);
    ctx.lineTo(p.x+p.w/2-6,p.y-13);ctx.stroke()
  }
  ctx.restore();
 }
 for(const b of bonus){
  ctx.save();ctx.translate(b.x,b.y+Math.sin(time*.08)*3);
  if(b.type==='shield'){
    if(!sprite(345,148,80,83,-23,-24,46,48)){
      ctx.font='29px system-ui';ctx.textAlign='center';ctx.fillText('🛡️',0,10)}
  }else{
    ctx.shadowBlur=11;ctx.shadowColor='#ffca4c';ctx.font='29px system-ui';
    ctx.textAlign='center';ctx.fillText('🚀',0,10)
  }
  ctx.restore();
 }
 for(const e of enemies){
  ctx.save();ctx.translate(e.x,e.y+Math.sin(time*.055+e.x*.01)*5);
  if(!sprite(0,0,146,108,-49,-38,98,75)){
    ctx.fillStyle='#e63c52';ctx.beginPath();ctx.arc(0,0,e.r+3,0,Math.PI*2);ctx.fill();
    if(enemyFace.complete&&enemyFace.naturalWidth)ctx.drawImage(enemyFace,-e.r,-e.r,e.r*2,e.r*2)
  }
  ctx.restore();
 }
 for(const h of helicopters){
  ctx.save();ctx.translate(h.x,h.y+Math.sin(time*.055+h.phase)*4);
  // Nose faces the direction of travel.
  if(h.vx>0)ctx.scale(-1,1);
  if(!sprite(155,0,282,138,-76,-39,152,74)){
    ctx.fillStyle='#f2f8ff';ctx.strokeStyle='#173958';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,0,51,21,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#233747';ctx.beginPath();ctx.moveTo(-80,-25);ctx.lineTo(80,-25);ctx.stroke()
  }
  ctx.restore();
 }

 ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=9;ctx.shadowOffsetY=4;ctx.shadowBlur=0;
 ctx.save();
 if(face.complete&&face.naturalWidth)ctx.drawImage(face,player.x-10,player.y-15,player.w+20,player.h+28);
 else{ctx.fillStyle='#bf915e';ctx.fillRect(player.x,player.y,player.w,player.h)}
 ctx.restore();ctx.restore();
 if(effects.shield>0){ctx.strokeStyle='#6eeaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x+25,player.y+26,38,0,Math.PI*2);ctx.stroke()}
 if(effects.jet>0){ctx.fillStyle='#ffcc43';ctx.beginPath();ctx.moveTo(player.x+12,player.y+53);ctx.lineTo(player.x+25,player.y+82+Math.random()*12);ctx.lineTo(player.x+38,player.y+53);ctx.fill()}
 ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillStyle='#18395c';
 ctx.fillText('NIVEAU '+(difficulty+1),W/2,Math.max(72,(parseInt(getComputedStyle(document.documentElement).fontSize)||16)*4));
}
function frame(t){const dt=Math.min((t-prev)/16.666||1,2);prev=t;update(dt);draw();requestAnimationFrame(frame)}reset();home();requestAnimationFrame(frame);
</script></body></html>
