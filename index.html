let W=390,H=700,dpr=1,player,platforms,score=0,best=0,state='menu',dir=0,prev=0,topY=0,step=0,keys={};
try{best=+(localStorage.getItem('farcettoBest')||0)}catch(e){}bestEl.textContent='★ '+best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){player={x:W/2-25,y:H-185,w:50,h:53,vy:-11};platforms=[{x:W/2-48,y:H-115,w:96,h:14,t:0}];let y=H-185;while(y>-H){y-=78+Math.random()*35;platforms.push(makePlatform(y))}score=0;topY=0;step=0;state='play';scoreEl.textContent=0;menu.style.display='none';prev=performance.now()}
function makePlatform(y){return{x:Math.random()*Math.max(1,W-86),y,w:65+Math.random()*25,h:13,t:Math.random()<.12?1:0,speed:(Math.random()-.5)*1.2}}
function end(){state='dead';if(score>best){best=score;bestEl.textContent='★ '+best;try{localStorage.setItem('farcettoBest',best)}catch(e){}}msg.innerHTML='Partie terminée !<br>Score : '+score+'<br>Record : '+best;btn.textContent='REJOUER';menu.style.display='flex'}
btn.onclick=reset;pause.onclick=()=>{if(state==='play'){state='paused';msg.textContent='Partie en pause';btn.textContent='REPRENDRE';menu.style.display='flex'}else if(state==='paused'){state='play';menu.style.display='none';prev=performance.now()}};btn.addEventListener('click',()=>{if(btn.textContent==='REPRENDRE'){state='play';menu.style.display='none'}});
function press(id,v){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();dir=v;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{if(dir===v)dir=0}))}press('left',-1);press('right',1);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&state==='menu')reset()});addEventListener('keyup',e=>keys[e.key]=false);
function update(dt){if(state!=='play')return;let move=dir||((keys.ArrowLeft||keys.a)?-1:0)||((keys.ArrowRight||keys.d)?1:0);player.x+=move*5.2*dt;if(player.x>W)player.x=-player.w;if(player.x+player.w<0)player.x=W;const oldBottom=player.y+player.h;player.vy+=.36*dt;player.y+=player.vy*dt;for(const p of platforms){if(p.t===1){p.x+=p.speed*dt;if(p.x<0||p.x+p.w>W)p.speed*=-1}if(player.vy>0&&oldBottom<=p.y+8&&player.y+player.h>=p.y&&player.x+player.w-8>p.x&&player.x+8<p.x+p.w){player.vy=-10.8;player.y=p.y-player.h;break}}
if(player.y<H*.42&&player.vy<0){const rise=H*.42-player.y;player.y+=rise;for(const p of platforms)p.y+=rise;topY+=rise;score=Math.max(score,Math.floor(topY/10));scoreEl.textContent=score}
platforms=platforms.filter(p=>p.y<H+30);let highest=Math.min(...platforms.map(p=>p.y));while(highest>-140){highest-=75+Math.random()*35;platforms.push(makePlatform(highest))}if(player.y>H+60)end()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.fillStyle='#0a1931';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff12';for(let x=20;x<W;x+=36)for(let y=20;y<H;y+=36){ctx.beginPath();ctx.arc(x,(y+(topY*.12)%36)%H,1.5,0,Math.PI*2);ctx.fill()}if(!player)return;for(let p of platforms){ctx.fillStyle=p.t?'#69e1ff':'#b4f76f';round(p.x,p.y,p.w,p.h,6);ctx.fill();ctx.fillStyle='#ffffff55';round(p.x+5,p.y+3,p.w-10,3,2);ctx.fill()}ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=9;ctx.shadowOffsetY=4;ctx.fillStyle='#fff';round(player.x-3,player.y-3,player.w+6,player.h+6,13);ctx.fill();ctx.shadowBlur=0;ctx.save();round(player.x,player.y,player.w,player.h,10);ctx.clip();if(face.complete&&face.naturalWidth)ctx.drawImage(face,player.x,player.y,player.w,player.h);else{ctx.fillStyle='#bf915e';ctx.fillRect(player.x,player.y,player.w,player.h)}ctx.restore();ctx.restore()}
function frame(t){const dt=Math.min((t-prev)/16.666||1,2);prev=t;update(dt);draw();requestAnimationFrame(frame)}reset();state='menu';menu.style.display='flex';requestAnimationFrame(frame);
